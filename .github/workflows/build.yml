name: Build WinXShell

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        configuration: [Release, Debug]
        platform: [Win32, x64]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: nuget restore WinXShell_VS2022.sln
    
    - name: Build
      run: msbuild WinXShell_VS2022.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m
    
    - name: Upload artifacts
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: WinXShell-${{ matrix.platform }}
        path: |
          ${{ matrix.platform }}/Release/*.exe
          ${{ matrix.platform }}/Release/*.dll
